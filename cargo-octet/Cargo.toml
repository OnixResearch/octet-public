[package]
name = "cargo-octet"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "First-class downstream consumer integration for Octet"
repository = "https://github.com/OnixResearch/octet"
homepage = "https://octet.dev"
readme = "../README.md"
default-run = "cargo-octet"

[[bin]]
name = "cargo-octet"
path = "src/main.rs"

[[bin]]
name = "cargo-slotcar"
path = "src/bin/cargo-slotcar.rs"

[[bin]]
name = "cargo-tigerstyle"
path = "src/bin/cargo-tigerstyle.rs"

[dependencies]
artifact-auth-core = { path = "../vendor/sources/artifact/crates/artifact-auth-core", default-features = false, features = ["serde"] }
artifact-auth-ed25519 = { path = "../vendor/sources/artifact/crates/artifact-auth-ed25519", default-features = false, features = ["serde"] }
octet-architecture-ir = { path = "../crates/octet-architecture-ir" }
octet-lint-metadata = { path = "../crates/octet-lint-metadata" }
octet-standards = { path = "../crates/octet-standards" }
valence-core = { git = "https://github.com/OnixResearch/valence-public.git", rev = "99cbe41f742035c37b6a7b503e4748e2e5ce2bea", package = "valence-core" }
bounded-exec = { git = "https://github.com/OnixResearch/bounded-exec-public.git", rev = "ff4af395b2c415fddd1ed51f4829aeba2d4259a5", package = "bounded-exec" }
cap-std = "3"
libc = "0.2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "1"
unicode-ident = "=1.0.24"
wasmparser = "=0.253.0"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
gimli = { version = "=0.34.0", default-features = false, features = ["read", "std"] }
rustc-demangle = "=0.1.28"

[build-dependencies]
blake3 = "1"

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
object = { version = "=0.37.3", default-features = false, features = ["write", "std"] }
gimli = { version = "=0.34.0", default-features = false, features = ["write", "std"] }
hegeltest = { version = "=0.14.27", features = ["native"] }
iddqd = "0.4.5"
tempfile = "3"
wat = "=1.253.0"
wasm-encoder = "=0.253.0"
